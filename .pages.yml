# Pages CMS configuration for mahatracker.org
# https://pagescms.org
#
# This describes entries.json to the CMS so collaborators get a form per record
# instead of hand-editing JSON. It is a DRAFT: see the three notes below before
# pointing the hosted CMS at this repository.
#
# NOTE 1 - record order. index.html renders entries in file order and does not
#   sort them, and validate.pl treats the file as newest-first. Pages CMS has no
#   documented control over where a new record is written. Before relying on the
#   CMS, either confirm it preserves order (add a test record, check the diff)
#   or have index.html sort after fetch, which makes file order cosmetic.
#
# NOTE 2 - the `sources` field. 23 entries currently hold bare strings, such as
#   "USRTK", alongside the {label, url} objects declared below. Pages CMS has no
#   documented mixed string-or-object list, so those 23 may be dropped or
#   mangled on save. Normalise them before enabling the CMS.
#
# NOTE 3 - empty versus absent. Every record carries stance, state, stateCode
#   and govParty, using "" where they do not apply, while enacted/actorD/actorR/
#   bipartisan appear only on policy records, because validate.pl rejects them
#   elsewhere. Pages CMS has no documented way to omit a key, so it may write
#   these onto every record. Save one record through the CMS and run
#   `perl validate.pl` before trusting it with the rest.

content:
  - name: entries
    label: Entries
    type: file
    path: entries.json
    format: json
    list: true
    fields:
      - name: id
        label: ID
        type: string
        required: true
        pattern:
          regex: "^e[0-9]{3}$"
          message: 'Must look like e042 - the letter e and three digits, unique across the file.'
        description: 'Never reuse an existing id. Check the highest one in the file and add one.'

      - name: date
        label: Date
        type: string
        required: true
        pattern:
          regex: "^[0-9]{4}(-[0-9]{2}(-[0-9]{2})?)?$"
          message: 'Use 2026-11-08, or 2026-11, or 2026 - whatever precision the source supports.'
        description: 'Sorts the record. Deliberately plain text, not a date picker, so a month or a year alone stays allowed.'

      - name: dateLabel
        label: Date shown on the page
        type: string
        required: true
        description: 'What a reader sees, e.g. "November 8, 2026" or "Spring 2024". The year must match the Date field.'

      - name: dateApprox
        label: Date is approximate
        type: boolean

      - name: title
        label: Title
        type: string
        required: true
        description: 'Clicking this on the site reveals the description.'

      - name: description
        label: Description
        type: text
        required: true
        description: 'Plain prose. Raw HTML is allowed and will render - this is how the video embeds work - so do not paste formatted text from a word processor.'

      - name: link
        label: Primary link
        type: string
        description: 'The single URL the title points to. Further reading goes in Sources.'

      - name: sources
        label: Sources
        type: object
        list: true
        fields:
          - name: label
            label: Publication
            type: string
            required: true
          - name: url
            label: URL
            type: string
            required: true
        description: 'Both parts are needed. A publication named without a URL renders as dead text - see NOTE 2 at the top of this file.'

      - name: category
        label: Category
        type: select
        required: true
        options:
          values:
            - name: policy
              label: Policy
            - name: politics
              label: Politics
            - name: media
              label: Media
            - name: event
              label: Event

      - name: level
        label: Level
        type: select
        required: true
        options:
          values:
            - name: federal
              label: Federal
            - name: state
              label: State
            - name: movement
              label: Movement
        description: 'federal and state with category Policy appear on the Scorecard. Everything else appears on the Movement Timeline.'

      - name: stance
        label: Position on health
        type: select
        options:
          values:
            - name: advancing
              label: Advancing
            - name: opposing
              label: Opposing
            - name: neutral
              label: Neutral
        description: 'Enacted federal and state policy only. Leave blank on everything else - the validator rejects a stance on a non-policy record.'

      - name: themes
        label: Themes
        type: select
        options:
          multiple: true
          values:
            - name: pesticides
              label: Pesticides
            - name: toxics
              label: Toxics
            - name: food
              label: Food
            - name: foodaccess
              label: Food access
            - name: healthcare
              label: Healthcare
            - name: medication
              label: Medication
            - name: vaccines
              label: Vaccines
            - name: vectors
              label: Vectors
            - name: illness
              label: Illness
        description: 'These drive the filter rail. The list is fixed - adding a new theme means editing this file and validate.pl together.'

      - name: tags
        label: Tags
        type: string
        list: true
        description: 'Free text, e.g. an administration or a sponsor. Reuse an existing spelling where one fits rather than inventing a near-duplicate.'

      - name: state
        label: State
        type: string
        description: 'Full name, e.g. "West Virginia". Leave blank for federal and movement records.'

      - name: stateCode
        label: State code
        type: string
        pattern:
          regex: "^([a-z]{2})?$"
          message: 'Two lowercase letters, e.g. wv - or blank.'
        description: 'Must agree with State. These are stored separately and nothing enforces the pairing.'

      - name: govParty
        label: Governor's party
        type: select
        options:
          values:
            - name: D
              label: Democrat
            - name: R
              label: Republican
        description: 'State policy records only.'

      # The four below belong only on policy records. validate.pl raises an
      # error if any of them appears on a record that is not policy.
      - name: enacted
        label: Enacted
        type: boolean
        description: 'Policy records only. Signed or otherwise in force, as opposed to introduced.'

      - name: actorD
        label: Democratic sponsor
        type: boolean
        description: 'Policy records only.'

      - name: actorR
        label: Republican sponsor
        type: boolean
        description: 'Policy records only.'

      - name: bipartisan
        label: Bipartisan
        type: boolean
        description: 'Policy records only.'
