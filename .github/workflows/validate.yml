# Checks entries.json on every push and pull request.
#
# The point is that *any* route into the data gets the same checks: the GitHub
# web editor, a CMS, a pull request from a collaborator, or Claude. If a record
# goes missing, lands in the wrong half, or breaks the schema, this turns the
# commit red and emails whoever pushed it.
#
# Note what this does NOT do: GitHub Pages publishes from the branch on its own
# schedule, so a failing check does not stop a bad commit going live. It tells
# you quickly; it does not gate. Gating needs either branch protection with
# pull requests, or moving Pages to deploy through Actions.

name: Validate entries.json

on:
  push:
  pull_request:
  workflow_dispatch:   # adds a "Run workflow" button on the Actions tab

# Allow one run per branch; a second push cancels the first rather than queueing.
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Schema and encoding
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # validate.pl uses only JSON::PP, which ships with Perl, so there is
      # nothing to install. The runner already has Perl.
      - name: Check the schema
        id: schema
        run: |
          set -o pipefail
          perl validate.pl entries.json 2>&1 | tee validate-output.txt

      # Double-encoded UTF-8 has slipped in before, via editors that write a
      # file as Latin-1. It renders as "Â" or "â€" on the live page. These byte
      # sequences do not occur in correctly encoded English text.
      - name: Check for mojibake
        if: always()
        run: |
          perl -e '
            my $f = "entries.json";
            open my $fh, "<:raw", $f or die "$f: $!\n";
            my $n = 0;
            while (my $line = <$fh>) {
              next unless $line =~ /\xc3\x82|\xc3\xa2\xe2\x82\xac|\xc3\xa2\xc2/;
              printf "  line %d: %s\n", $., substr($line, 0, 160);
              $n++;
            }
            if ($n) {
              print "\nFAIL: $n line(s) look like double-encoded UTF-8.\n";
              print "The file must be saved as UTF-8, not Latin-1.\n";
              exit 1;
            }
            print "No mojibake found.\n";
          '

      # Surface the result on the run page, so someone who does not read CI logs
      # can still see which entry is wrong.
      - name: Report
        if: always()
        run: |
          {
            echo '## entries.json'
            echo
            echo '```'
            cat validate-output.txt 2>/dev/null || echo '(the validator did not run)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
